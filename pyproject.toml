[project]
name = "koten"
version = "0.1.0"
description = "悩み×古典の一節で10分以上の長尺動画を作るパイプライン"
readme = "docs/SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "numpy>=2.0",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 埋め込みモデルと日本語の分かち書き（重いので必要なときだけ：uv sync --extra ml）
ml = [
    "sentence-transformers>=3.0",
    "sudachidict-core>=20240716",
    "sudachipy>=0.6.8",
]

[project.scripts]
koten = "koten.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koten"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fastapi の TestClient が httpx を使うことへの外部ライブラリの警告
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
