[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdbot"
version = "0.1.0"
description = "商品CFD（原油・銀）向けの自動売買アルゴリズム研究・バックテスト基盤"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# 外部データの研究（./cfd context）: Yahoo の日足と EIA の Excel を読む
research = ["yfinance>=0.2.50", "xlrd>=2.0"]
# ニュースの埋め込み（./cfd news setup で入る。Mac の中だけで動く。PyTorch を含むので大きい）
# EmbeddingGemma 2 は sentence-transformers 6.1 から。画像も扱うモデルなので、文章だけでも画像の部品
# （Pillow・torchvision。[image] で入る）が要る
news = ["sentence-transformers[image]>=6.1"]

[tool.setuptools.packages.find]
include = ["cfdbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
