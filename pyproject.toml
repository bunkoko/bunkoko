[project]
name = "survey-coder"
version = "0.1.0"
description = "自由回答の分類集計サービス（ローカルLLM）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]
# darwin-arm64 の wheel を必須にする（design.md 3章）
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# GiNZA 5.3.0 は SudachiPy 0.7 未満が必要（パイプライン用の依存を入れるときのため）
constraint-dependencies = ["sudachipy>=0.6.11,<0.7"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1"
pythonpath = ["."]
testpaths = ["tests"]
# tests/guard は unittest 形式の別系統（python3 -m unittest discover -s tests/guard）
norecursedirs = ["tests/guard"]

[tool.ruff]
target-version = "py314"
line-length = 120
# フック（標準出力に JSON を返すので print を使う）とそのテストは別系統（標準ライブラリのみ）
extend-exclude = [".claude", "tests/guard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
