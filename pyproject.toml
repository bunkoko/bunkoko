[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdbot"
version = "0.1.0"
description = "商品CFD（原油・銀）向けの自動売買アルゴリズム研究・バックテスト基盤"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cfdbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
