# 既定値（SPEC §11）。パスは環境に合わせて変える。
# KOTEN_SETTINGS 環境変数で別のファイルを指定できる。

[paths]
# 本文・埋め込み・動画の置き場所。いまはSDカード（docs/decisions.md D-008）
# 外付けHDDに移すときは "/Volumes/<HDDの名前>/koten" に変える
hdd_root = "/Volumes/SDカード/古典×悩み"
ssd_root = "~/koten-hot"
photos_dir = "~/Pictures/koten-bg"
bgm_dir = "~/Music/koten-bgm"

[llm.augment]                 # Mac上のローカルLLM（docs/decisions.md D-005）
provider = "ollama"           # Ollama 独自の API。LM Studio などは "openai_compatible"（endpoint に /v1）
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"          # ollama list に出るモデル名（docs/decisions.md D-005）
think = false                 # 思考モードを止める（考える途中経過で時間を使い切らないように）
num_ctx = 4096                # 文脈の長さ。大きいとメモリを食い、GPU に収まらず遅くなる
num_predict = 1024            # 出力の上限トークン数
keep_alive = "10m"
timeout_sec = 300
response_format = "json_schema"   # openai_compatible のときだけ使う

[augment]                     # 引用候補の抽出（SPEC §8.3）
prompt = "augment_v1"         # prompts/<prompt>.md
quote_min = 20
quote_max = 120
max_quotes = 3
summary_max = 60
worry_max = 20
retries = 2
batch_size = 200              # この件数ごとに HDD へまとめて書く
context_chars = 200

[llm.script]
provider = "anthropic"
model = "claude-sonnet-5-5"

[llm.judge]                   # G3 忠実さの判定
provider = "anthropic"
model = "claude-haiku-5-5"

[llm.worries]                 # 悩みの正規化（件数が少ないので augment と同じローカルLLMを使う）
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"
think = false
num_ctx = 4096                # augment と同じにする（違うと Ollama がモデルを読み込み直して遅くなる）
num_predict = 512
keep_alive = "10m"
timeout_sec = 300

[worries]                     # 悩みマスター（SPEC §9）
prompt = "worries_v1"         # prompts/<prompt>.md
text_max = 40                 # 一般化した悩み文の上限
cluster_threshold = 0.92      # 埋め込みのコサイン類似度がこれ以上なら同じクラスタ
novelty_days = 90             # 前回使ってからこの日数で「新しさ」が満点に戻る

[embed]
model = "intfloat/multilingual-e5-large"
dtype = "float16"
device = "auto"               # Mac では mps を使う
batch_size = 32
passage_prefix = "passage: "  # e5 の接頭辞。Ruri 系に替えるときは「検索文書: 」など
query_prefix = "query: "

[bm25]
tokenizer = "sudachi"         # SudachiPy が入らないときは "bigram"

[rerank]
model = "要確認"

[episode]
min_sec = 600
max_sec = 900
chars_per_min = 300
same_format_in_row_max = 2

[recency]
work_episodes = 10
author_episodes = 5
photo_episodes = 5
worry_cluster_days = 30

[voicevox]
endpoint = "http://127.0.0.1:50021"
speaker_id = 3

[video]
width = 1920
height = 1080
fps = 30
bitrate = "8M"

[api]
port = 8765                   # 127.0.0.1 だけで待ち受ける

[rate_limit]
per_host_per_sec = 1

[http]
# User-Agent に連絡先を入れる（SPEC §8.1）。{contact} は .env の KOTEN_CONTACT に置き換わる
user_agent = "koten-videos/0.1 (+contact: {contact})"
timeout_sec = 30

[chunk]
min_chars = 200
max_chars = 600
