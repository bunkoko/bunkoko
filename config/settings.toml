# 既定値（SPEC §11）。パスは環境に合わせて変える。
# KOTEN_SETTINGS 環境変数で別のファイルを指定できる。

[paths]
# 本文・埋め込み・動画の置き場所。いまはSDカード（docs/decisions.md D-008）
# 外付けHDDに移すときは "/Volumes/<HDDの名前>/koten" に変える
hdd_root = "/Volumes/SDカード/古典×悩み"
ssd_root = "~/koten-hot"
photos_dir = "~/Pictures/koten-bg"
bgm_dir = "~/Music/koten-bgm"

[llm.augment]                 # Mac上のローカルLLM（Ollama の OpenAI互換API。LM Studio なら 1234）
provider = "openai_compatible"
endpoint = "http://127.0.0.1:11434/v1"
model = "要確認"              # ローカルLLMで読み込んだモデル名（docs/decisions.md D-005）
response_format = "json_schema"   # 対応していなければ "json_object" か "none"
timeout_sec = 300

[augment]                     # 引用候補の抽出（SPEC §8.3）
prompt = "augment_v1"         # prompts/<prompt>.md
quote_min = 20
quote_max = 120
max_quotes = 3
summary_max = 60
worry_max = 20
retries = 2
batch_size = 200              # この件数ごとに HDD へまとめて書く
context_chars = 200

[llm.script]
provider = "anthropic"
model = "claude-sonnet-5-5"

[llm.judge]                   # G3 忠実さの判定
provider = "anthropic"
model = "claude-haiku-5-5"

[embed]
model = "intfloat/multilingual-e5-large"
dtype = "float16"
device = "auto"               # Mac では mps を使う
batch_size = 32
passage_prefix = "passage: "  # e5 の接頭辞。Ruri 系に替えるときは「検索文書: 」など
query_prefix = "query: "

[bm25]
tokenizer = "sudachi"         # SudachiPy が入らないときは "bigram"

[rerank]
model = "要確認"

[episode]
min_sec = 600
max_sec = 900
chars_per_min = 300
same_format_in_row_max = 2

[recency]
work_episodes = 10
author_episodes = 5
photo_episodes = 5
worry_cluster_days = 30

[voicevox]
endpoint = "http://127.0.0.1:50021"
speaker_id = 3

[video]
width = 1920
height = 1080
fps = 30
bitrate = "8M"

[api]
port = 8765                   # 127.0.0.1 だけで待ち受ける

[rate_limit]
per_host_per_sec = 1

[http]
# User-Agent に連絡先を入れる（SPEC §8.1）。自分の連絡先に書き換える
user_agent = "koten-videos/0.1 (+contact: set-your-email@example.com)"
timeout_sec = 30

[chunk]
min_chars = 200
max_chars = 600
