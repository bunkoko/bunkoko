# 既定値（SPEC §11）。パスは環境に合わせて変える。
# KOTEN_SETTINGS 環境変数で別のファイルを指定できる。

[paths]
# 本文・埋め込み・動画の置き場所。4TB の外付け HDD（名前 koten-hdd・APFS。docs/decisions.md D-031）
# 前は SD カード（/Volumes/SDカード/古典×悩み。D-008）。写すときは koten hdd-copy --from でその場所を渡す
hdd_root = "/Volumes/koten-hdd/koten"
ssd_root = "~/koten-hot"
photos_dir = "~/Pictures/koten-bg"
bgm_dir = "~/Music/koten-bgm"

[llm.augment]                 # Mac上のローカルLLM（docs/decisions.md D-005）
provider = "ollama"           # Ollama 独自の API。LM Studio などは "openai_compatible"（endpoint に /v1）
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"          # ollama list に出るモデル名（docs/decisions.md D-005）
think = false                 # 思考モードを止める（考える途中経過で時間を使い切らないように）
num_ctx = 4096                # 文脈の長さ。大きいとメモリを食い、GPU に収まらず遅くなる
num_predict = 1024            # 出力の上限トークン数
keep_alive = "10m"
timeout_sec = 300
response_format = "json_schema"   # openai_compatible のときだけ使う

[augment]                     # 引用候補の抽出（SPEC §8.3）
prompt = "augment_v1"         # prompts/<prompt>.md
quote_min = 20
quote_max = 120
max_quotes = 3
summary_max = 60
worry_max = 20
retries = 2
batch_size = 200              # この件数ごとに HDD へまとめて書く
context_chars = 200

[llm.check]                   # 今の本（著作権あり）での照合（SPEC R8・D-017）。手元の Ollama だけ（クラウド不可）
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"
think = false
num_ctx = 4096
num_predict = 64              # ラベルだけを返させる
keep_alive = "5m"
timeout_sec = 300

[check]
prompt = "check_v1"           # prompts/<prompt>.md

[llm.script]                  # 台本を書く（SPEC §8.7）。Mac の Claude Code をサブスクリプションで呼ぶ
provider = "claude_cli"
command = "claude"
model = "opus"                # 利用者の判断（docs/decisions.md 2026-10-25）
effort = "xhigh"              # claude --effort（low・medium・high・xhigh・max）
extra_args = ["--safe-mode"]
timeout_sec = 1800            # xhigh は考える時間が長いので長めにする

[llm.judge]                   # G3 忠実さの判定（台本を書いたのとは別の呼び出し）
provider = "claude_cli"
command = "claude"
model = "opus"
effort = "xhigh"
extra_args = ["--safe-mode"]
timeout_sec = 1200

[script]                      # 台本と検証ゲート（SPEC §8.7・§8.8）
prompt = "script_v4"          # prompts/<prompt>.md
judge_prompt = "judge_v1"
judge_facts_prompt = "judge_v3"  # 背景の事実・語釈・解釈を使った章の判定（1文ずつ）
retries = 2                   # G1・G3・長さで章を書き直す回数
length_tolerance = 0.3        # 章の文字数が目安から ±30% を超えたら書き直させる

[llm.facts]                   # 背景の事実の下書き（koten facts draft）。人が確かめてから使う
provider = "claude_cli"
model = "opus"
effort = "high"
extra_args = ["--safe-mode"]
timeout_sec = 1200

[facts]                       # docs/background_facts_plan.md・D-012・D-013
draft_prompt = "facts_draft_v1"
max_facts = 8                 # 1人（1作品）あたりの下書きの数
wikitext_max_chars = 30000    # AI に渡すウィキペディアの wikitext の長さの上限

[llm.worries]                 # 悩みの正規化（件数が少ないので augment と同じローカルLLMを使う）
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"
think = false
num_ctx = 4096                # augment と同じにする（違うと Ollama がモデルを読み込み直して遅くなる）
num_predict = 512
keep_alive = "10m"
timeout_sec = 300

[llm.retrieve]                # 検索の言い換え・HyDE と一節の最終選択（SPEC §8.6）
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "gemma4:26b"
think = false
num_ctx = 4096                # augment と同じにする
num_predict = 1024
keep_alive = "10m"
timeout_sec = 300

[retrieve]
query_prompt = "query_v1"     # prompts/<prompt>.md
select_prompt = "select_v1"
rrf_k = 60
fused_top = 50                # RRF で統合したあとに残す件数
shortlist = 10                # LLM に最終選択させる候補の数

[llm.grader]                  # 検索の評価の grader（2値）。Mac の Claude Code を呼ぶ（API キーは使わない）
provider = "claude_cli"
command = "claude"
model = "haiku"               # Claude Code の --model に渡す（別名か正式なモデル名）
extra_args = ["--safe-mode"]  # CLAUDE.md・MCP・プラグインを読まない（ログインはそのまま）
timeout_sec = 300

[eval]
grader_prompt = "grader_v1"   # prompts/<prompt>.md

[worries]                     # 悩みマスター（SPEC §9）
prompt = "worries_v1"         # prompts/<prompt>.md
text_max = 40                 # 一般化した悩み文の上限
cluster_threshold = 0.92      # 埋め込みのコサイン類似度がこれ以上なら同じクラスタ
novelty_days = 90             # 前回使ってからこの日数で「新しさ」が満点に戻る

[embed]
model = "intfloat/multilingual-e5-large"
dtype = "float16"
device = "auto"               # Mac では mps を使う
batch_size = 32
passage_prefix = "passage: "  # e5 の接頭辞。Ruri 系に替えるときは「検索文書: 」など
query_prefix = "query: "

[bm25]
tokenizer = "sudachi"         # SudachiPy が入らないときは "bigram"

[rerank]                      # クロスエンコーダ。"要確認" のままならリランクしない（docs/decisions.md D-010）
model = "要確認"
device = "auto"

[episode]
min_sec = 600
max_sec = 900
chars_per_min = 300
same_format_in_row_max = 2

[recency]
work_episodes = 10
author_episodes = 5
photo_episodes = 5
worry_cluster_days = 30

[voicevox]
endpoint = "http://127.0.0.1:50021"
speaker_id = 3

[video]
width = 1920
height = 1080
fps = 30
bitrate = "8M"

[api]
port = 8765                   # 127.0.0.1 だけで待ち受ける

[ndl]                         # 国立国会図書館デジタルコレクション（M8a。docs/decisions.md D-003）
# 使う資料を一度だけまとめて取る（koten ref ndl-snapshot）。一度だけまとめて取る使い方は
# 「継続的な利用」に当たらないと利用者が判断した（D-003。2026-10-29）。止めるときは false
fetch_enabled = true
image_size = "full"           # IIIF の画像の大きさ（full か、幅を決めるなら "2000,"）

[rate_limit]
per_host_per_sec = 1

[rate_limit.min_interval_sec]   # ホスト名の末尾ごとの最小の間隔（秒）
"ndl.go.jp" = 3.0             # 国会図書館：続けて取ると止められた記録がある（docs/decisions.md D-003）

[http]
# User-Agent に連絡先を入れる（SPEC §8.1）。{contact} は .env の KOTEN_CONTACT に置き換わる
user_agent = "koten-videos/0.1 (+contact: {contact})"
timeout_sec = 30

[chunk]
min_chars = 200
max_chars = 600
