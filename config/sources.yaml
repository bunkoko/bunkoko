# 取得対象（SPEC §6）
aozora:
  # 作品CSV（list_person_all_extended_utf8.zip）
  list_url: "https://www.aozora.gr.jp/index_pages/list_person_all_extended_utf8.zip"
  # テキストzipの取得元。テキストファイルURLの先頭 "https://www.aozora.gr.jp/" をこの値に置き換えて取得する
  # GitHub のミラーは 404 だったので公式サイトから1秒1件以下で取る（docs/decisions.md D-002）
  text_base_url: "https://www.aozora.gr.jp/"
  # NDC の前方一致（"K" 接頭の児童書記号は外して比べる）
  ndc_prefixes: ["1", "914", "915"]
  # NDC に関係なく入れる作品（作品名と著者名で指定。著者名は姓名を空白なしでつなぐ）
  include_works:
    - {title: "人生論ノート", author: "三木清"}
  # 入れない作品ID（青空文庫の作品ID）
  exclude_work_ids: []

# 古い英訳（Standard Ebooks。M8a）。GitHub の raw ファイルを net.py で1つずつ取る（git clone はしない）
# 取る前に、資料の台帳（config/ref_works.csv）でその ref_id が使える（PD_JP）と判定されている必要がある
# Standard Ebooks が足した手入れは CC0。原著者と訳者の没年は台帳で判定する
standardebooks:
  raw_base: "https://raw.githubusercontent.com/standardebooks/"
  branch: master
  editions:
    # 台帳の ref_id: {repo: GitHub のリポジトリ名, canon: config/canon.yaml の作品記号, split: 分け方}
    R-long-meditations: {repo: marcus-aurelius_meditations_george-long, canon: meditations, split: meditations}
    R-legge-analects: {repo: confucius_analects_james-legge, canon: lunyu, split: analects}

