# 取得対象（SPEC §6）
aozora:
  # 作品CSV（list_person_all_extended_utf8.zip）
  list_url: "https://www.aozora.gr.jp/index_pages/list_person_all_extended_utf8.zip"
  # テキストzipの取得元。テキストファイルURLの先頭 "https://www.aozora.gr.jp/" をこの値に置き換えて取得する
  # GitHub のミラーは 404 だったので公式サイトから1秒1件以下で取る（docs/decisions.md D-002）
  text_base_url: "https://www.aozora.gr.jp/"
  # NDC の前方一致（"K" 接頭の児童書記号は外して比べる）
  ndc_prefixes: ["1", "914", "915"]
  # NDC に関係なく入れる作品（作品名と著者名で指定。著者名は姓名を空白なしでつなぐ）
  include_works:
    - {title: "人生論ノート", author: "三木清"}
    # 佐藤春夫訳（1964年没）。2023年までに青空文庫に入った（作品ID 60669。NDC は要確認なのでここで指定する）
    # 題名の書き方が違えば、--dry-run が「見つからない作品」に出す
    - {title: "現代語訳　方丈記", author: "鴨長明"}
  # 有名な作家の詩歌・小説（D-025）。下の作家の作品のうち、NDC が include_authors_ndc に合うものを足す
  # 作家名は作品CSVの表記どおりに書く。別名（夏目金之助など）も書く（作品を選ぶ処理は別名をまとめない）
  # 「訳者」として載っている訳（与謝野晶子訳『源氏物語』など）は、作家名では選ばれない。include_translators で選ぶ
  # 足す前に Mac で `uv run koten ingest aozora --dry-run` を実行し、作品の数と付加情報づけの時間を見る
  include_authors_ndc: ["911", "913", "917"]
  include_authors:
    # 第1群（まず足したい作家）
    - 夏目漱石
    - 夏目金之助
    - 芥川竜之介
    - 太宰治
    - 宮沢賢治
    - 石川啄木
    - 中原中也
    - 萩原朔太郎
    - 与謝野晶子
    - 樋口一葉
    - 森鴎外
    - 森林太郎
    - 島崎藤村
    - 正岡子規
    - 中島敦
    - 梶井基次郎
    - 有島武郎
    - 国木田独歩
    - 新美南吉
    - 堀辰雄
    - 坂口安吾
    - 北原白秋
    - 林芙美子
    - 谷崎潤一郎
    - 室生犀星
    - 高村光太郎
    # 第2群（小説）。付加情報づけの時間が長すぎるときは、ここから下を外す
    - 永井荷風
    - 永井壮吉
    - 幸田露伴
    - 岡本かの子
    - 田山花袋
    - 田山録弥
    - 泉鏡花
    - 泉鏡太郎
    - 織田作之助
    - 菊池寛
    - 横光利一
    - 伊藤左千夫
    - 長塚節
    - 二葉亭四迷
    - 尾崎紅葉
    - 徳冨蘆花
    - 徳冨健次郎
    # 第2群（重い題材を扱う作品。一節の注意フラグで外れることが多い）
    - 原民喜
    - 北条民雄
    - 小林多喜二
    # 第2群（詩・短歌・俳句）
    - 三好達治
    - 八木重吉
    - 山村暮鳥
    - 尾崎放哉
    - 種田山頭火
    - 斎藤茂吉
    - 高浜虚子
    - 上田敏
    - 土井晩翠
  # 古典の訳を、訳者の名前で選ぶ（NDC は問わない。D-029）。原著者の没年が作品CSVで空の訳（紫式部・作者不詳）は、
  # config/aozora_review.csv に人が確かめた没年・公表の年を書くまで判定不能のまま（本文を保存しない）
  include_translators:
    - 与謝野晶子
    - 尾崎士郎
    - 佐藤春夫
    - 宮本百合子
  # 入れない作品ID（青空文庫の作品ID）
  exclude_work_ids: []

# 古い英訳（Standard Ebooks。M8a）。GitHub の raw ファイルを net.py で1つずつ取る（git clone はしない）
# 取る前に、資料の台帳（config/ref_works.csv）でその ref_id が使える（PD_JP）と判定されている必要がある
# Standard Ebooks が足した手入れは CC0。原著者と訳者の没年は台帳で判定する
standardebooks:
  raw_base: "https://raw.githubusercontent.com/standardebooks/"
  branch: master
  editions:
    # 台帳の ref_id: {repo: GitHub のリポジトリ名, canon: config/canon.yaml の作品記号, split: 分け方}
    R-long-meditations: {repo: marcus-aurelius_meditations_george-long, canon: meditations, split: meditations}
    R-legge-analects: {repo: confucius_analects_james-legge, canon: lunyu, split: analects}

