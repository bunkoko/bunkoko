# テーマの統制語彙（SPEC §8.3・§9）。付加情報と悩みの正規化はここから1〜3個を選ぶ
themes:
  - 嫉妬・比較
  - 孤独
  - 将来への不安
  - 失敗・責任
  - 仕事の量
  - 職場の人間関係
  - いじめ・嫌がらせ
  - 転職の迷い
  - 怒り
  - 自信のなさ
  - 承認欲求
  - 怠け・習慣
  - 時間・忙しさ
  - 友人関係
  - 家族
  - 恋愛
  - 幸福
  - 死生観
  - 老い
  - 誠実・嘘
  - 働く意味
  - 学び・成長
  - 決断・迷い

# テーマの重み（SPEC §9 優先度。人が決める。書かないテーマは 1.0）。
# 根拠は config/stats.csv の数値（例：職場の人間関係 32.9%、仕事の量 39.5%）
weights:
  仕事の量: 1.3
  失敗・責任: 1.3
  職場の人間関係: 1.3
  将来への不安: 1.2
  転職の迷い: 1.2
  孤独: 1.2

