# ポートフォリオ学習の設定（python scripts/train.py が読む）
# 書かなかった項目は既定値（cfdbot/train/config.py）が使われる。

[data]
dir = "data"                 # MT5 から書き出した CSV を置くフォルダ（同じ銘柄の時間足違いも全部置いてよい）
# 方針: 売買の判断は粒度の大きい足、約定の再現は M5。
# フィリップの実測コストでは H1 は往復コストが損切り幅の 10〜19%（銀・WTI・ブレント）で不向きなので H4 にする
# （2026-10 の check_data。H4 は 2.5〜9.5%）。H1 も比べたいときは ["H1", "H4"]
signal_timeframes = ["H4"]   # 売買の足。H4 のファイルが無くても H1 や M5 から自動で作る
fill_timeframe = "M5"        # 約定の再現に使う細かい足（M5 が無い銘柄は売買の足の高値・安値で推定）
                             # "auto" = 一番細かいファイル / "none" = 使わない
grid_timeframe = "H1"        # 下の grid の本数がどの時間足の本数か（他の時間足では同じ時間幅に自動換算）
server_tz = 9                # MT5 サーバー時刻。フィリップは日本時間（UTC+9、夏時間なし）。"ny_close" = 米東部+7時間の業者
broker = "phillip"
instruments = ""             # 実測スプレッド等の銘柄仕様 JSON（例: "config/instruments_phillip.json"）
events = "config/events.csv"  # 指標イベント CSV（FOMC・CPI・雇用統計・祝日でずれた EIA。毎月 4 か月先まで追加）
fx = 150.0                   # USDJPY_H1.csv が無いときの円換算レート

[account]
equity = 1_000_000           # 実際の運用資金（円）
base_risk = 0.01             # 学習時の 1回の損失（配分の基準）
min_risk_per_trade = 0.0025  # 配分後の 1回の損失の下限
max_risk_per_trade = 0.02    # 配分後の 1回の損失の上限
max_total_risk = 0.04        # 同時保有の損失の合計の上限
max_leverage_symbol = 1.0    # 1銘柄のレバレッジ上限（名目建玉 ÷ 資産）
max_leverage_total = 2.0     # 全銘柄合計のレバレッジ上限
daily_loss_limit = 0.03
max_drawdown_halt = 0.25
peak_since = ""              # DD 停止から再開するときだけ、再開する日（例 "2027-03-06"）。それ以前の高値を基準にしない

[account.cluster_max_risk]
energy = 0.02                # WTI + ブレント
metals = 0.02                # 銀 + 金

[walkforward]
train_months = 24            # 学習期間
test_months = 6              # 検証期間（学習に使わない）
objective = "sharpe"         # 評価: sharpe / sortino / mar
min_trades = 15              # 学習期間の取引がこれ未満のパラメータは選ばない
plateau = true               # 隣り合うパラメータとの平均で評価する（尖った最適値を避ける）

[portfolio]
allocation = "erc"           # erc: リスク寄与を均等 / inverse_vol / sharpe_tilt / equal
target_vol = 0.12            # 学習期間での年率ボラティリティの目標（これでリスクの大きさが決まる）
max_train_dd = 0.15          # 学習期間の最大DDの上限（超えたら全体を縮小）
min_score = 0.3              # 学習期間のシャープレシオがこれ未満の戦略は使わない
max_strategies_per_symbol = 1
shrinkage = 0.3              # 相関の推定を控えめにする度合い（0〜1）

[compute]
time_budget_hours = 12       # 見積もりがこれを超えたら組み合わせを間引く
workers = 0                  # この Mac の並列数（0 = CPU数-1）
listen = "127.0.0.1"         # "0.0.0.0" で iPad など他の端末も参加できる（--listen でも指定可）
port = 8765

# ---------------------------------------------------------------------------
# 探索する戦略と範囲（本数は grid_timeframe の足数。H4 なら 1/4、M15 なら 4 倍に自動換算される）
# "exit." で始まるものは出口設定（trail_atr など）。enabled = false で無効。
# 範囲を広げるほど偶然良く見えるものを選びやすくなるので、むやみに増やさない。
#
# 上位足フィルタ（上位足の終値が EMA より上なら買いだけ・下なら売りだけ）も学習で選ばせる例:
#   "htf.timeframe" = ["none", "H4", "D1"]     # 組み合わせが最大 5 倍になる
#   "htf.ema" = [50, 100]
# 戦略ごとに売買の足を変える例:   timeframes = ["H4"]
# 時間足ごとに範囲を個別指定する例（自動換算を使わない）:
#   [strategies.donchian.grid_H4]
#   entry_period = [20, 30, 45]

[strategies.donchian]
symbols = ["WTI", "BRENT", "SILVER", "GOLD"]
[strategies.donchian.grid]
entry_period = [60, 120, 180, 240]
exit_period = [30, 60, 90]
trend_ema = [0, 400, 800]
"exit.trail_atr" = [2.5, 3.5, 4.5]

[strategies.squeeze]
symbols = ["WTI", "BRENT", "SILVER", "GOLD"]
[strategies.squeeze.grid]
box_period = [20, 40, 60]
min_squeeze_bars = [6, 12, 20]
kc_mult = [1.25, 1.5, 1.75]
stop_box_frac = [0.5, 1.0]
"exit.time_stop_bars" = [24, 48]

[strategies.pullback]
symbols = ["WTI", "BRENT", "SILVER", "GOLD"]
[strategies.pullback.grid]
fast_ema = [20, 40, 80]
slow_ema = [100, 200, 400]
adx_min = [15.0, 20.0, 25.0]
touch_atr = [0.5, 1.0]
"exit.trail_atr" = [2.5, 3.5]

[strategies.reversion]
symbols = ["SILVER", "GOLD"]
[strategies.reversion.grid]
period = [20, 40]
z_entry = [1.8, 2.2]
rsi_period = [2, 3]
adx_max = [15.0, 20.0, 25.0]
"exit.max_hold_bars" = [24, 48]
