# iPhone アプリ（ios/）が、Mac でビルドできるかを確かめる。
# 署名はしない（チーム ID がいらない）。iPhone 向けにコンパイルして、エラーがないかだけを見る。
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build (Paid)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KenkoKanri.xcodeproj -scheme KenkoKanri \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check the shortcut action (App Intents) is in the app
        run: |
          grep -n -B2 -A3 "ExtractAppIntentsMetadata" build.log | grep -E "ExtractAppIntentsMetadata|warning|error" || true
          app=$(find build/Build/Products -maxdepth 2 -name "KenkoKanri.app" | head -1)
          echo "app: $app"
          find "$app" -path "*Metadata.appintents*" | head
          test -n "$(find "$app" -path "*Metadata.appintents*" -name "*.actionsdata")"

      - name: Build (Free)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KenkoKanri.xcodeproj -scheme KenkoKanri \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO KENKO_EDITION=Free \
            2>&1 | tee build-free.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-free.log

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build*.log
          if-no-files-found: ignore
